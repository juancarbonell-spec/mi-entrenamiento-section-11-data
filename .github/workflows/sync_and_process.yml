name: Sync Dropbox y procesar FIT

on:
  workflow_call:
  schedule:
    - cron: "0 7 * * *"   
  workflow_dispatch:          # lanzable a mano desde Actions

jobs:
  sync-y-procesar:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install fitdecode pandas numpy requests

      - name: Descargar FIT nuevos desde Dropbox
        env:
          DROPBOX_TOKEN: ${{ secrets.DROPBOX_TOKEN }}
        run: python scripts/sync_dropbox.py

      - name: Procesar FIT y generar CSVs
        run: python scripts/procesar_fit.py

      - name: Commit y push de resultados
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add FIT/ data/
          git diff --cached --quiet || git commit -m "Auto: sync Dropbox + actualizar CSVs [skip ci]"
          git push
