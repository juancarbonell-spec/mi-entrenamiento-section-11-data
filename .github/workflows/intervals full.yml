name: Sync Detailed Minute-by-Minute Data

on:
  workflow_dispatch:
    inputs:
      days_back:
        description: 'Cuantos dias atras (1=hoy, 2=ayer+hoy, etc)'
        default: '3'
        type: string

jobs:
  sync-streams:
    runs-on: ubuntu-latest
    
    env:
      INTERVALS_API_KEY: ${{ secrets.INTERVALS_ICU_API_KEY }}
      INTERVALS_ATHLETE_ID: ${{ secrets.INTERVALS_ICU_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy

      - name: Download Minute-by-Minute Streams
        run: |
          python3 << 'PYSCRIPT'
          import requests
          import pandas as pd
          import numpy as np
          from datetime import datetime, timedelta
          import json
          import os
          import time

          athlete_id = os.environ.get("INTERVALS_ATHLETE_ID", "").strip()
          api_key = os.environ.get("INTERVALS_API_KEY", "").strip()
          days_back = int(os.environ.get("DAYS_BACK", "3"))
          
          if not athlete_id or not api_key:
              print("ERROR: Faltan secrets")
              exit(1)
          
          os.makedirs("data", exist_ok=True)
          
          # Fecha de corte
          cutoff = (datetime.now() - timedelta(days=days_back)).strftime("%Y-%m-%d")
          print(f"Buscando actividades desde: {cutoff}")

          # 1. DESCARGAR LISTA DE ACTIVIDADES (mismo metodo que tu script original)
          params = {"oldest": "2000-01-01", "newest": datetime.now().strftime("%Y-%m-%d")}
          
          activities = []
          urls = [
              f"https://intervals.icu/api/v1/athlete/{athlete_id}/activities",
              f"https://intervals.icu/api/v1/athlete/0/activities"
          ]
          
          for url in urls:
              try:
                  r = requests.get(url, auth=("API_KEY", api_key), params=params, timeout=30)
                  if r.status_code == 200:
                      data = r.json()
                      if isinstance(data, list):
                          activities = data
                          print(f"OK: {len(activities)} actividades descargadas")
                          break
              except Exception as e:
                  print(f"Error en {url}: {e}")

          if not activities:
              print("No se recibieron actividades")
              exit(1)

          # 2. FILTRAR RUN/RIDE RECIENTES
          recent = []
          for a in activities:
              if not isinstance(a, dict):
                  continue
              if a.get("type") not in ["Run", "Ride"]:
                  continue
              date = (a.get("start_date") or "")[:10]
              if date >= cutoff:
                  recent.append(a)

          print(f"Actividades Run/Ride recientes: {len(recent)}")
          
          if not recent:
              print("No hay actividades recientes para procesar")
              exit(0)

          # 3. DESCARGAR STREAMS MINUTO A MINUTO
          running = []
          cycling = []

          for idx, act in enumerate(recent[:10], 1):  # Max 10 para no saturar
              aid = act.get("id")
              atype = act.get("type")
              aname = act.get("name", "")
              adate = act.get("start_date", "")[:10]
              
              print(f"\n[{idx}] {atype} {adate} - {aname[:30]}...")
              time.sleep(0.4)
              
              try:
                  # Descargar streams detallados
                  stream_url = f"https://intervals.icu/api/v1/athlete/{athlete_id}/activities/{aid}/streams"
                  r = requests.get(stream_url, auth=("API_KEY", api_key), timeout=60)
                  
                  if r.status_code == 404:
                      print("   No tiene streams detallados")
                      continue
                  if r.status_code != 200:
                      print(f"   Error HTTP {r.status_code}")
                      continue
                  
                  streams = r.json()
                  if not streams or "time" not in streams:
                      continue
                  
                  # Crear DataFrame con TODOS los datos segundo a segundo
                  df = pd.DataFrame({"time": streams["time"]})
                  
                  if "heartrate" in streams:
                      df["hr"] = streams["heartrate"]
                  if "cadence" in streams:
                      df["cadence"] = streams["cadence"]
                  if "watts" in streams:
                      df["power"] = streams["watts"]
                  if "velocity_smooth" in streams:
                      df["speed"] = streams["velocity_smooth"]
                  if "altitude" in streams:
                      df["altitude"] = streams["altitude"]
                  if "ground_time" in streams:
                      df["ground_time"] = streams["ground_time"]
                  if "vertical_oscillation" in streams:
                      df["vert_osc"] = streams["vertical_oscillation"]
                  
                  df = df.replace({None: np.nan})
                  
                  # Agrupar por MINUTO
                  df["minute"] = (df["time"] // 60).astype(int)
                  
                  minutes_data = []
                  for minute_num, group in df.groupby("minute"):
                      record = {"minute": int(minute_num)}
                      
                      if "hr" in group:
                          record["hr_avg"] = round(group["hr"].mean(), 1)
                          record["hr_max"] = int(group["hr"].max())
                      if "cadence" in group:
                          record["cadence_avg"] = round(group["cadence"].mean(), 1)
                      if "power" in group:
                          record["power_avg"] = round(group["power"].mean(), 1)
                          record["power_max"] = int(group["power"].max())
                      if "speed" in group:
                          record["speed_avg"] = round(group["speed"].mean(), 2)
                          if group["speed"].mean() > 0:
                              record["pace_min_km"] = round(16.6667 / group["speed"].mean(), 2)
                      if "ground_time" in group:
                          record["ground_time_ms"] = round(group["ground_time"].mean(), 1)
                      if "vert_osc" in group:
                          record["vert_osc_cm"] = round(group["vert_osc"].mean(), 2)
                      
                      minutes_data.append(record)
                  
                  activity_obj = {
                      "id": aid,
                      "date": act.get("start_date"),
                      "type": atype,
                      "name": aname,
                      "total_minutes": len(minutes_data),
                      "summary": {
                          "distance_m": act.get("distance"),
                          "moving_time_s": act.get("moving_time"),
                          "tss": act.get("tss")
                      },
                      "minute_by_minute": minutes_data
                  }
                  
                  if atype == "Run":
                      running.append(activity_obj)
                      print(f"   OK Running: {len(minutes_data)} minutos")
                  else:
                      cycling.append(activity_obj)
                      print(f"   OK Cycling: {len(minutes_data)} minutos")
                      
              except Exception as e:
                  print(f"   Error: {e}")

          # 4. GUARDAR
          result = {
              "generated": datetime.now().isoformat(),
              "running": running,
              "cycling": cycling
          }
          
          with open("data/minute_by_minute.json", "w", encoding="utf-8") as f:
              json.dump(result, f, indent=2)
          
          print(f"\n✅ Guardado: {len(running)} running, {len(cycling)} cycling")
          PYSCRIPT
        env:
          DAYS_BACK: ${{ github.event.inputs.days_back }}

      - name: Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -f data/minute_by_minute.json
          git commit -m "Add minute-by-minute data [skip ci]" || echo "No changes"
          git push
