name: Sync Detailed Streams (Full Metrics)

on:
  workflow_dispatch:
    inputs:
      days_back:
        description: 'Dias hacia atras'
        required: true
        default: '7'
        type: string

jobs:
  sync-detailed:
    runs-on: ubuntu-latest
    
    env:
      INTERVALS_API_KEY: ${{ secrets.INTERVALS_ICU_API_KEY }}
      INTERVALS_ATHLETE_ID: ${{ secrets.INTERVALS_ICU_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy

      - name: Sync Detailed Streams
        run: |
          python << 'EOF'
          import requests, os, json, time
          from datetime import datetime, timedelta
          import pandas as pd
          import numpy as np

          athlete_id = os.environ.get("INTERVALS_ATHLETE_ID","").strip()
          api_key = os.environ.get("INTERVALS_API_KEY","").strip()
          
          if not athlete_id or not api_key:
              print("ERROR: Faltan secrets")
              exit(1)
              
          os.makedirs("data", exist_ok=True)

          days_back = int(os.environ.get("DAYS_BACK", "7"))
          cutoff_date = (datetime.now() - timedelta(days=days_back)).strftime("%Y-%m-%d")
          
          print(f"Descargando desde: {cutoff_date}")
          print(f"Athlete ID: {athlete_id}")

          # EXACTAMENTE IGUAL QUE EL SCRIPT ORIGINAL
          params = {"oldest": cutoff_date, "newest": datetime.now().strftime("%Y-%m-%d"), "limit": 100}

          # Funciones de calculo
          def calc_np(vals):
              if not vals or len(vals) < 10:
                  return None
              s = pd.Series(vals).dropna()
              if len(s) < 10:
                  return round(s.mean(), 1)
              window = max(2, len(s) // 20)
              rolling = s.rolling(window=window, min_periods=1).mean()
              return round((rolling ** 4).mean() ** 0.25, 1)

          def calc_zones(series, zones):
              if series is None or series.empty:
                  return {}
              result = {}
              for name, (min_v, max_v) in zones.items():
                  result[name] = int(((series >= min_v) & (series <= max_v)).sum())
              return result

          ZONAS_FC = {
              'Z1_recuperacion': (106, 126),
              'Z2_aerobico': (127, 140),
              'Z3_tempo': (141, 147),
              'Z4_umbral': (148, 157),
              'Z5_vo2max': (158, 999)
          }

          # DESCARGAR ACTIVIDADES (igual que script original)
          activities_urls = [
              f"https://intervals.icu/api/v1/athlete/{athlete_id}/activities",
              f"https://intervals.icu/api/v1/athlete/0/activities"
          ]
          
          activities = []
          for url in activities_urls:
              try:
                  r = requests.get(url, auth=("API_KEY", api_key), params=params, timeout=30)
                  print(f"URL: {url} -> Status: {r.status_code}")
                  if r.status_code == 200:
                      activities = r.json()
                      break
              except Exception as e:
                  print(f"Error en URL {url}: {e}")
                  continue

          if not activities:
              print("No se encontraron actividades")
              exit(1)

          print(f"Total actividades: {len(activities)}")

          # Filtrar Run y Ride recientes
          valid_activities = [
              a for a in activities 
              if isinstance(a, dict) and a.get("type") in ["Run", "Ride"] 
              and a.get("id")
          ]
          
          print(f"Run/Ride a procesar: {len(valid_activities)}")

          running_data = []
          cycling_data = []

          for idx, activity in enumerate(valid_activities[:15], 1):  # Limitar a 15 para no saturar
              act_id = activity.get("id")
              act_type = activity.get("type")
              act_date = activity.get("start_date", "")[:10]
              
              print(f"\n[{idx}] {act_type} - {act_date} - ID:{act_id}")
              time.sleep(0.5)  # Rate limiting
              
              try:
                  # DESCARGAR STREAMS (endpoint especifico)
                  streams_url = f"https://intervals.icu/api/v1/athlete/{athlete_id}/activities/{act_id}/streams"
                  
                  r = requests.get(streams_url, auth=("API_KEY", api_key), timeout=60)
                  
                  if r.status_code == 404:
                      print("  No hay streams disponibles")
                      continue
                  elif r.status_code == 403:
                      print(f"  Acceso denegado (403)")
                      continue
                  elif r.status_code != 200:
                      print(f"  Error HTTP {r.status_code}")
                      continue
                  
                  streams = r.json()
                  
                  if not streams or "time" not in streams:
                      print("  Streams vacios")
                      continue
                  
                  # PROCESAR DATAFRAME
                  df = pd.DataFrame({"time": streams.get("time", [])})
                  
                  if "heartrate" in streams:
                      df["hr"] = streams["heartrate"]
                  if "cadence" in streams:
                      df["cadence"] = streams["cadence"]
                  if "watts" in streams:
                      df["power"] = streams["watts"]
                  if "velocity_smooth" in streams:
                      df["speed"] = streams["velocity_smooth"]
                  if "altitude" in streams:
                      df["altitude"] = streams["altitude"]
                  if "grade_smooth" in streams:
                      df["grade"] = streams["grade_smooth"]
                  if "temp" in streams:
                      df["temp"] = streams["temp"]
                  
                  # Running especifico
                  if "ground_time" in streams:
                      df["ground_time"] = streams["ground_time"]
                  if "vertical_oscillation" in streams:
                      df["vert_osc"] = streams["vertical_oscillation"]
                  if "stride_length" in streams:
                      df["stride_length"] = streams["stride_length"]
                  
                  df = df.replace({None: np.nan})
                  
                  if len(df) == 0:
                      continue
                  
                  # Crear minutos
                  df["minute"] = (df["time"] // 60).astype(int)
                  total_mins = int(df["minute"].max()) + 1
                  
                  # METRICAS GLOBALES
                  analytics = {
                      "duration_minutes": total_mins,
                      "total_records": len(df),
                      "hr_avg": round(df["hr"].mean(), 1) if "hr" in df else None,
                      "hr_max": int(df["hr"].max()) if "hr" in df else None,
                      "hr_min": int(df["hr"].min()) if "hr" in df else None,
                      "hr_zones_seconds": calc_zones(df.get("hr"), ZONAS_FC) if "hr" in df else {},
                      "cadence_avg": round(df["cadence"].mean(), 1) if "cadence" in df else None,
                      "cadence_max": int(df["cadence"].max()) if "cadence" in df else None,
                      "speed_avg_ms": round(df["speed"].mean(), 2) if "speed" in df else None,
                      "speed_max_ms": round(df["speed"].max(), 2) if "speed" in df else None,
                      "power_avg": round(df["power"].mean(), 1) if "power" in df else None,
                      "power_max": int(df["power"].max()) if "power" in df else None,
                      "power_np": calc_np(df["power"].tolist()) if "power" in df else None,
                      "elevation_gain_m": round(df["altitude"].max() - df["altitude"].min(), 1) if "altitude" in df else None,
                  }
                  
                  # Limpiar None
                  analytics = {k: v for k, v in analytics.items() if v is not None}
                  
                  # METRICAS POR MINUTO
                  minute_records = []
                  for m in range(total_mins):
                      mdf = df[df["minute"] == m]
                      if len(mdf) == 0:
                          continue
                      
                      rec = {"minute": m}
                      
                      if "hr" in mdf:
                          rec["hr_avg"] = round(mdf["hr"].mean(), 1)
                          rec["hr_max"] = int(mdf["hr"].max())
                      if "cadence" in mdf:
                          rec["cadence_avg"] = round(mdf["cadence"].mean(), 1)
                      if "power" in mdf:
                          rec["power_avg"] = round(mdf["power"].mean(), 1)
                          rec["power_np"] = calc_np(mdf["power"].tolist())
                      if "speed" in mdf:
                          rec["speed_avg"] = round(mdf["speed"].mean(), 2)
                          rec["pace_min_km"] = round(16.6667 / mdf["speed"].mean(), 2) if mdf["speed"].mean() > 0 else None
                      if "altitude" in mdf:
                          rec["altitude"] = round(mdf["altitude"].mean(), 1)
                      if "grade" in mdf:
                          rec["grade"] = round(mdf["grade"].mean(), 1)
                      
                      # Running especifico por minuto
                      if "ground_time" in mdf:
                          rec["ground_time_ms"] = round(mdf["ground_time"].mean(), 1)
                      if "vert_osc" in mdf:
                          rec["vert_osc_cm"] = round(mdf["vert_osc"].mean(), 2)
                      if "stride_length" in mdf:
                          rec["stride_length_m"] = round(mdf["stride_length"].mean(), 2)
                      
                      rec["samples"] = len(mdf)
                      minute_records.append(rec)
                  
                  # Construir objeto final
                  activity_obj = {
                      "id": act_id,
                      "name": activity.get("name"),
                      "type": act_type,
                      "date": activity.get("start_date"),
                      "intervals_icu_url": f"https://intervals.icu/activities/{act_id}",
                      "summary": {
                          "distance_m": activity.get("distance"),
                          "moving_time_s": activity.get("moving_time"),
                          "tss": activity.get("tss"),
                          "if": activity.get("ifr"),
                          "feel": activity.get("feel"),
                          "rpe": activity.get("rpe")
                      },
                      "analytics": analytics,
                      "minute_by_minute": minute_records
                  }
                  
                  if act_type == "Run":
                      running_data.append(activity_obj)
                      print(f"  Running: {total_mins}min, {len(minute_records)} registros")
                  else:
                      cycling_data.append(activity_obj)
                      print(f"  Cycling: {total_mins}min, {len(minute_records)} registros")
                      
              except Exception as e:
                  print(f"  Error procesando: {e}")

          # GUARDAR RESULTADOS
          print(f"\nGuardando archivos...")
          
          output = {
              "generated_at": datetime.now().isoformat(),
              "athlete_id": athlete_id,
              "period_days": days_back,
              "running_count": len(running_data),
              "cycling_count": len(cycling_data),
              "activities": running_data + cycling_data
          }
          
          with open("data/training_analytics.json", "w", encoding="utf-8") as f:
              json.dump(output, f, indent=2, ensure_ascii=False)
          
          with open("data/running_detailed.json", "w", encoding="utf-8") as f:
              json.dump({"generated": datetime.now().isoformat(), "count": len(running_data), "activities": running_data}, f, indent=2)
          
          with open("data/cycling_detailed.json", "w", encoding="utf-8") as f:
              json.dump({"generated": datetime.now().isoformat(), "count": len(cycling_data), "activities": cycling_data}, f, indent=2)
          
          print(f"\nOK: {len(running_data)} running, {len(cycling_data)} cycling")
          print("Archivos: training_analytics.json, running_detailed.json, cycling_detailed.json")
          EOF
        env:
          DAYS_BACK: ${{ github.event.inputs.days_back || '7' }}

      - name: Push results to Repository
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -f data/training_analytics.json data/running_detailed.json data/cycling_detailed.json
          git diff --cached --quiet || git commit -m "Update detailed streams [skip ci]" || echo "No changes"
          git push
