name: Sync Detailed Streams - Debug

on:
  workflow_dispatch:
    inputs:
      days_back:
        description: 'Dias atras'
        default: '7'
        type: string

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      INTERVALS_API_KEY: ${{ secrets.INTERVALS_ICU_API_KEY }}
      INTERVALS_ATHLETE_ID: ${{ secrets.INTERVALS_ICU_ID }}

    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests pandas

      - name: Download and Process
        run: |
          python3 << 'PYEOF'
          import sys
          import subprocess
          
          # Verificar que requests esté instalado
          try:
              import requests
              import pandas as pd
              import numpy as np
              from datetime import datetime, timedelta
              import json
              import os
              import time
          except ImportError as e:
              print(f"Error importando: {e}")
              subprocess.check_call([sys.executable, "-m", "pip", "install", "requests", "pandas", "numpy"])
              import requests
              import pandas as pd
              import numpy as np
              from datetime import datetime, timedelta
              import json
              import os
              import time

          athlete_id = os.environ.get("INTERVALS_ATHLETE_ID", "").strip()
          api_key = os.environ.get("INTERVALS_API_KEY", "").strip()
          
          days_back = int(os.environ.get("DAYS_BACK", "7"))
          cutoff = (datetime.now() - timedelta(days=days_back)).strftime("%Y-%m-%d")
          
          print(f"Athlete: {athlete_id}")
          print(f"Buscando desde: {cutoff}")

          # Igual que tu sync.yml original pero con limit=1000 para traer TODO
          params = {
              "oldest": "2000-01-01", 
              "newest": datetime.now().strftime("%Y-%m-%d"),
              "limit": 1000  # <-- IMPORTANTE: Pedir muchas para no quedarnos con las viejas
          }

          activities = []
          urls = [
              f"https://intervals.icu/api/v1/athlete/{athlete_id}/activities",
              f"https://intervals.icu/api/v1/athlete/0/activities"
          ]
          
          for url in urls:
              try:
                  r = requests.get(url, auth=("API_KEY", api_key), params=params, timeout=30)
                  print(f"Status: {r.status_code} desde {url}")
                  if r.status_code == 200:
                      data = r.json()
                      if isinstance(data, list):
                          activities = data
                          print(f"Recibidas {len(activities)} actividades")
                          break
              except Exception as e:
                  print(f"Error: {e}")

          if not activities:
              print("No se recibieron actividades")
              exit(1)

          # DEBUG: Mostrar TODAS las fechas recibidas (primeras 20)
          print("\n=== ACTIVIDADES RECIBIDAS (primeras 20) ===")
          for i, a in enumerate(activities[:20]):
              if isinstance(a, dict):
                  print(f"{i+1}. {a.get('type')} | {a.get('start_date', 'N/A')[:10]} | {a.get('name', 'N/A')[:30]}")

          # Filtrar por fecha
          recent = []
          for a in activities:
              if not isinstance(a, dict):
                  continue
              date = (a.get("start_date") or "")[:10]
              if date >= cutoff and a.get("type") in ["Run", "Ride"]:
                  recent.append(a)

          print(f"\n=== ACTIVIDADES RECIENTES (>{cutoff}): {len(recent)} ===")
          for a in recent:
              print(f"- {a.get('type')} {a.get('start_date')[:10]} {a.get('name')[:40]}")

          if not recent:
              print("ERROR: No hay actividades recientes. Verifica que tu athlete_id sea correcto.")
              exit(0)

          # Procesar solo las 5 más recientes
          running = []
          cycling = []

          for idx, act in enumerate(recent[:5], 1):
              aid = act.get("id")
              atype = act.get("type")
              adate = act.get("start_date", "")[:10]
              
              print(f"\n[{idx}] Procesando {atype} {adate}...")
              time.sleep(0.5)
              
              try:
                  url = f"https://intervals.icu/api/v1/athlete/{athlete_id}/activities/{aid}/streams"
                  r = requests.get(url, auth=("API_KEY", api_key), timeout=60)
                  
                  if r.status_code != 200:
                      print(f"  Skip: HTTP {r.status_code}")
                      continue
                  
                  streams = r.json()
                  if not streams or "time" not in streams:
                      print(f"  Skip: Sin datos de tiempo")
                      continue
                  
                  # Crear DataFrame simple
                  df = pd.DataFrame({"t": streams["time"]})
                  
                  if "heartrate" in streams:
                      df["hr"] = streams["heartrate"]
                  if "cadence" in streams:
                      df["cad"] = streams["cadence"]
                  if "watts" in streams:
                      df["pwr"] = streams["watts"]
                  if "velocity_smooth" in streams:
                      df["spd"] = streams["velocity_smooth"]
                  
                  df["min"] = (df["t"] // 60).astype(int)
                  
                  # Agrupar por minuto
                  mins = []
                  for m, group in df.groupby("min"):
                      record = {"minute": int(m)}
                      if "hr" in group:
                          record["hr"] = round(group["hr"].mean(), 1)
                      if "cad" in group:
                          record["cad"] = round(group["cad"].mean(), 1)
                      if "pwr" in group:
                          record["pwr"] = round(group["pwr"].mean(), 1)
                      if "spd" in group:
                          record["spd"] = round(group["spd"].mean(), 2)
                      mins.append(record)
                  
                  obj = {
                      "id": aid,
                      "date": act.get("start_date"),
                      "type": atype,
                      "name": act.get("name"),
                      "minutes": len(mins),
                      "data": mins
                  }
                  
                  if atype == "Run":
                      running.append(obj)
                      print(f"  ✓ Running: {len(mins)} min")
                  else:
                      cycling.append(obj)
                      print(f"  ✓ Cycling: {len(mins)} min")
                      
              except Exception as e:
                  print(f"  Error: {e}")

          # Guardar
          import os
          os.makedirs("data", exist_ok=True)
          
          with open("data/running_detailed.json", "w") as f:
              json.dump({"count": len(running), "activities": running}, f, indent=2)
          
          with open("data/cycling_detailed.json", "w") as f:
              json.dump({"count": len(cycling), "activities": cycling}, f, indent=2)
          
          print(f"\nGuardado: {len(running)} running, {len(cycling)} cycling")
          PYEOF
        env:
          DAYS_BACK: ${{ github.event.inputs.days_back }}

      - name: Push
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add -f data/*.json
          git commit -m "Update streams [skip ci]" || echo "No changes"
          git push
