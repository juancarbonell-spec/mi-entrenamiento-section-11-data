name: Sync FIT Splits from Garmin

on:
  schedule:
    - cron: '0 */6 * * *'   # cada 6 horas
  workflow_dispatch:
    inputs:
      max_activities:
        description: 'Cuantas actividades procesar como maximo (ej: 30)'
        default: '90'
        type: string
  workflow_call:
    inputs:
      max_activities:
        description: 'Cuantas actividades procesar como maximo (ej: 30)'
        default: '90'
        type: string

jobs:
  sync-fit-splits:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fitparse

      - name: Process FIT files into lap splits
        run: |
          python3 << 'PYSCRIPT'
          import os
          import json
          import glob
          from datetime import datetime, timezone
          import fitparse

          MAX_ACTIVITIES = int(os.environ.get("MAX_ACTIVITIES") or "30")
          FIT_DIR = "FIT"
          OUTPUT_FILE = "data/garmin-splits.json"

          os.makedirs("data", exist_ok=True)

          # ── 1. CARGAR ACTIVIDADES YA PROCESADAS ─────────────────────────────────
          already_processed = set()
          existing_activities = []

          if os.path.exists(OUTPUT_FILE):
              try:
                  with open(OUTPUT_FILE, "r", encoding="utf-8") as f:
                      existing_data = json.load(f)
                  existing_activities = existing_data.get("activities", [])
                  already_processed = {a["fit_file"] for a in existing_activities if "fit_file" in a}
                  print(f"Actividades ya procesadas en garmin-splits.json: {len(already_processed)}")
              except Exception as e:
                  print(f"No se pudo leer {OUTPUT_FILE} (empezando de cero): {e}")

          # ── 2. DESCUBRIR ARCHIVOS FIT NUEVOS ────────────────────────────────────
          all_fit_files = sorted(
              glob.glob(os.path.join(FIT_DIR, "*.fit")) +
              glob.glob(os.path.join(FIT_DIR, "*.FIT"))
          )
          if not all_fit_files:
              print(f"No hay archivos .fit en {FIT_DIR}/")
              exit(0)

          latest_date_prefix = None
          if existing_activities:
              latest_start = max(
                  a["start_time"] for a in existing_activities if "start_time" in a
              )
              latest_date_prefix = latest_start[:10].replace("-", ".")
              print(f"Última actividad procesada: {latest_start}  →  prefijo de fecha: {latest_date_prefix}")

          def is_new(fpath):
              fname = os.path.basename(fpath)
              if fname in already_processed:
                  return False
              if latest_date_prefix is not None:
                  file_date = fname[:10]
                  if file_date < latest_date_prefix:
                      return False
              return True

          new_fit_files = [f for f in all_fit_files if is_new(f)]
          print(f"Archivos FIT totales: {len(all_fit_files)}  |  Nuevos a procesar: {len(new_fit_files)}")

          if not new_fit_files:
              print("Nada nuevo que procesar.")
              with open(".nothing_to_do", "w") as f:
                  f.write("ok")
              exit(0)

          # ── 3. HELPERS ───────────────────────────────────────────────────────────
          def semicircles_to_deg(val):
              if val is None:
                  return None
              return round(val * (180 / 2**31), 6)

          def safe(val, decimals=2):
              if val is None:
                  return None
              if isinstance(val, float):
                  return round(val, decimals)
              return val

          def parse_fit(filepath):
              try:
                  fit = fitparse.FitFile(filepath)
              except Exception as e:
                  print(f"  Error leyendo {filepath}: {e}")
                  return None

              session = {}
              for msg in fit.get_messages("session"):
                  for field in msg:
                      if field.value is not None:
                          session[field.name] = field.value
              if not session:
                  for msg in fit.get_messages("activity"):
                      for field in msg:
                          if field.value is not None:
                              session.setdefault(field.name, field.value)

              SESSION_GARMIN_KNOWN = {
                  "unknown_110": ("activity_name",                str),
                  "unknown_81":  ("local_timestamp",              int),
                  "unknown_38":  ("end_position_lat",             int),
                  "unknown_39":  ("end_position_long",            int),
                  "unknown_215": ("aerobic_training_effect",      (int, float)),
                  "unknown_216": ("anaerobic_training_effect",    (int, float)),
                  "unknown_188": ("primary_benefit",              int),
                  "unknown_212": ("training_effect_label",        int),
                  "unknown_196": ("aerobic_te_message",           (int, float)),
                  "unknown_199": ("anaerobic_te_message",         (int, float)),
                  "unknown_168": ("training_load_peak",           (int, float)),
                  "unknown_150": ("performance_condition",        (int, float)),
                  "unknown_185": ("training_stress_score",        (int, float)),
                  "unknown_207": ("training_readiness_score",     (int, float)),
                  "unknown_169": ("total_grit",                   (int, float)),
                  "unknown_170": ("avg_flow",                     (int, float)),
                  "unknown_106": ("total_fractional_ascent",      (int, float)),
                  "unknown_211": ("avg_step_length",              (int, float)),
                  "unknown_151": ("avg_left_power_phase_peak",    (int, float)),
                  "unknown_152": ("avg_right_power_phase_peak",   (int, float)),
                  "unknown_178": ("avg_left_pedal_smoothness",    (int, float)),
                  "unknown_180": ("avg_right_pedal_smoothness",   (int, float)),
                  "unknown_184": ("avg_combined_pedal_smoothness",(int, float)),
                  "unknown_200": ("num_valid_gears",              int),
                  "unknown_205": ("avg_left_torque_effectiveness",(int, float)),
                  "unknown_206": ("avg_right_torque_effectiveness",(int, float)),
                  "unknown_192": ("feel",                         int),
                  "unknown_193": ("rpe_x10",                      int),
              }
              for src, (dst, expected_type) in SESSION_GARMIN_KNOWN.items():
                  if src in session and session[src] is not None:
                      val = session[src]
                      if isinstance(val, expected_type):
                          session[dst] = val
                      else:
                          session[src + "_type_mismatch"] = f"expected {expected_type}, got {type(val).__name__}: {val}"
                          print(f"  AVISO: {src} tipo inesperado ({type(val).__name__}={val}), esperado {expected_type}")

              BENEFIT_LABELS = {
                  0: "no_benefit", 1: "recovery", 2: "base", 3: "tempo",
                  4: "threshold", 5: "vo2_max", 6: "anaerobic", 7: "sprint",
              }
              if "primary_benefit" in session and isinstance(session["primary_benefit"], int):
                  session["primary_benefit_label"] = BENEFIT_LABELS.get(session["primary_benefit"], f"unknown_{session['primary_benefit']}")

              FEEL_LABELS = {0: "no_data", 25: "bad", 50: "normal", 75: "good", 100: "excellent"}
              if "feel" in session and isinstance(session["feel"], int):
                  session["feel_label"] = FEEL_LABELS.get(session["feel"], f"unknown_{session['feel']}")

              READINESS_LABELS = {1: "poor", 2: "low", 3: "moderate", 4: "high", 5: "prime"}
              if "training_readiness_score" in session and isinstance(session["training_readiness_score"], int):
                  session["training_readiness_level"] = READINESS_LABELS.get(session["training_readiness_score"], None)

              sport      = session.get("sport", "unknown")
              sub_sport  = session.get("sub_sport", "")
              start_time = session.get("start_time")

              sport_str = str(sport).lower()
              sub_str   = str(sub_sport).lower()
              if "run" not in sport_str and "cycling" not in sport_str and "bike" not in sport_str:
                  if "run" not in sub_str and "cycling" not in sub_str and "bike" not in sub_str:
                      print(f"  Ignorando deporte: {sport} / {sub_sport}")
                      return None

              activity_type = "Run" if "run" in sport_str or "run" in sub_str else "Ride"

              LAP_GARMIN_KNOWN = {
                  "unknown_136": ("avg_respiration_rate", (int, float)),
                  "unknown_137": ("max_respiration_rate", (int, float)),
                  "unknown_145": ("est_sweat_loss",       (int, float)),
                  "unknown_155": ("resting_calories",     (int, float)),
                  "unknown_27":  ("lap_nec_lat",          int),
                  "unknown_28":  ("lap_nec_long",         int),
                  "unknown_29":  ("lap_swc_lat",          int),
                  "unknown_30":  ("lap_swc_long",         int),
              }

              laps = []
              for lap_num, msg in enumerate(fit.get_messages("lap"), start=1):
                  lap_data = {"lap": lap_num}
                  for field in msg:
                      if field.value is None:
                          continue
                      name  = field.name
                      value = field.value

                      if "position_lat" in name or "position_long" in name:
                          value = semicircles_to_deg(value)
                      elif isinstance(value, datetime):
                          value = value.isoformat()
                      elif isinstance(value, float):
                          value = safe(value, 3)

                      lap_data[name] = value

                  for src, (dst, expected_type) in LAP_GARMIN_KNOWN.items():
                      if src in lap_data and lap_data[src] is not None:
                          val = lap_data[src]
                          if isinstance(val, expected_type):
                              lap_data[dst] = val
                              del lap_data[src]
                          else:
                              print(f"  AVISO lap {lap_num}: {src} tipo inesperado ({type(val).__name__}={val})")

                  for key in ("avg_respiration_rate", "max_respiration_rate"):
                      if key in lap_data and isinstance(lap_data[key], (int, float)):
                          lap_data[key] = round(lap_data[key] / 100, 1)

                  laps.append({k: v for k, v in lap_data.items() if v is not None})

              if not laps:
                  print(f"  Sin laps en {os.path.basename(filepath)}")
                  return None

              def ts(v):
                  if isinstance(v, datetime):
                      return v.isoformat()
                  return str(v) if v else None

              meta = {
                  "fit_file":    os.path.basename(filepath),
                  "type":        activity_type,
                  "sport":       str(sport),
                  "sub_sport":   str(sub_sport),
                  "start_time":  ts(start_time),
                  "total_laps":  len(laps),
                  "session_summary": {
                      k: (ts(v) if isinstance(v, datetime) else
                          round(v, 3) if isinstance(v, float) else v)
                      for k, v in session.items()
                      if v is not None
                  },
                  "laps": laps,
              }

              return meta

          # ── 4. PROCESAR NUEVOS ARCHIVOS ──────────────────────────────────────────
          new_activities = []
          for fpath in new_fit_files:
              fname = os.path.basename(fpath)
              print(f"\nProcesando: {fname}")
              result = parse_fit(fpath)
              if result:
                  new_activities.append(result)
                  print(f"  ✓ {result['type']}  {result['start_time']}  |  {result['total_laps']} laps")

          print(f"\nNuevas actividades procesadas: {len(new_activities)}")

          # ── 5. COMBINAR CON LAS YA EXISTENTES ───────────────────────────────────
          all_activities = new_activities + existing_activities

          def sort_key(a):
              return a.get("start_time") or ""

          all_activities.sort(key=sort_key, reverse=True)
          all_activities = all_activities[:MAX_ACTIVITIES]

          print(f"Total actividades en garmin-splits.json: {len(all_activities)}")

          # ── 6. GUARDAR ───────────────────────────────────────────────────────────
          output = {
              "generated":        datetime.now(timezone.utc).isoformat(),
              "max_activities":   MAX_ACTIVITIES,
              "total_activities": len(all_activities),
              "activities":       all_activities,
          }

          with open(OUTPUT_FILE, "w", encoding="utf-8") as f:
              json.dump(output, f, indent=2, ensure_ascii=False)

          size_kb = os.path.getsize(OUTPUT_FILE) / 1024
          print(f"\n✅ Guardado {OUTPUT_FILE}  ({size_kb:.1f} KB)")
          PYSCRIPT
        env:
          MAX_ACTIVITIES: ${{ inputs.max_activities || github.event.inputs.max_activities || '30' }}

      - name: Migrate existing garmin-splits.json
        run: |
          python3 << 'MIGRATE'
          import json, os

          OUTPUT_FILE = "data/garmin-splits.json"
          if not os.path.exists(OUTPUT_FILE):
              print("No existe garmin-splits.json, nada que migrar.")
              exit(0)

          with open(OUTPUT_FILE, "r", encoding="utf-8") as f:
              data = json.load(f)

          SESSION_KNOWN = {
              "unknown_110": "activity_name",
              "unknown_81":  "local_timestamp",
              "unknown_38":  "end_position_lat",
              "unknown_39":  "end_position_long",
              "unknown_215": "aerobic_training_effect",
              "unknown_216": "anaerobic_training_effect",
              "unknown_188": "primary_benefit",
              "unknown_212": "training_effect_label",
              "unknown_196": "aerobic_te_message",
              "unknown_199": "anaerobic_te_message",
              "unknown_168": "training_load_peak",
              "unknown_150": "performance_condition",
              "unknown_185": "training_stress_score",
              "unknown_207": "training_readiness_score",
              "unknown_169": "total_grit",
              "unknown_170": "avg_flow",
              "unknown_106": "total_fractional_ascent",
              "unknown_211": "avg_step_length",
              "unknown_151": "avg_left_power_phase_peak",
              "unknown_152": "avg_right_power_phase_peak",
              "unknown_178": "avg_left_pedal_smoothness",
              "unknown_180": "avg_right_pedal_smoothness",
              "unknown_184": "avg_combined_pedal_smoothness",
              "unknown_200": "num_valid_gears",
              "unknown_205": "avg_left_torque_effectiveness",
              "unknown_206": "avg_right_torque_effectiveness",
              "unknown_192": "feel",
              "unknown_193": "rpe_x10",
          }

          LAP_KNOWN = {
              "unknown_136": "avg_respiration_rate",
              "unknown_137": "max_respiration_rate",
              "unknown_145": "est_sweat_loss",
              "unknown_155": "resting_calories",
              "unknown_27":  "lap_nec_lat",
              "unknown_28":  "lap_nec_long",
              "unknown_29":  "lap_swc_lat",
              "unknown_30":  "lap_swc_long",
          }

          BENEFIT_LABELS   = {0:"no_benefit",1:"recovery",2:"base",3:"tempo",4:"threshold",5:"vo2_max",6:"anaerobic",7:"sprint"}
          FEEL_LABELS      = {0:"no_data",25:"bad",50:"normal",75:"good",100:"excellent"}
          READINESS_LABELS = {1:"poor",2:"low",3:"moderate",4:"high",5:"prime"}

          def migrate_session(d):
              out = {}
              for k, v in d.items():
                  if k in SESSION_KNOWN:
                      new_key = SESSION_KNOWN[k]
                      out[new_key] = v
                      if new_key == "primary_benefit" and isinstance(v, int):
                          out["primary_benefit_label"] = BENEFIT_LABELS.get(v, f"unknown_{v}")
                      elif new_key == "feel" and isinstance(v, int):
                          out["feel_label"] = FEEL_LABELS.get(v, f"unknown_{v}")
                      elif new_key == "training_readiness_score" and isinstance(v, int):
                          out["training_readiness_level"] = READINESS_LABELS.get(v)
                  else:
                      out[k] = v
              return out

          def migrate_lap(d):
              out = {}
              for k, v in d.items():
                  if k in LAP_KNOWN:
                      new_key = LAP_KNOWN[k]
                      if new_key in ("avg_respiration_rate", "max_respiration_rate"):
                          if isinstance(v, (int, float)):
                              v = round(v / 100, 1)
                      out[new_key] = v
                  else:
                      out[k] = v
              return out

          migrated = 0
          for act in data.get("activities", []):
              if "session_summary" in act:
                  act["session_summary"] = migrate_session(act["session_summary"])
              new_laps = []
              for lap in act.get("laps", []):
                  new_laps.append(migrate_lap(lap))
              act["laps"] = new_laps
              migrated += 1

          with open(OUTPUT_FILE, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2, ensure_ascii=False)

          print(f"Migradas {migrated} actividades.")
          MIGRATE

      - name: Push garmin-splits.json
        run: |
          if [ -f .nothing_to_do ]; then
            echo "Sin FIT nuevos — nada que commitear."
            exit 0
          fi
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          if [ -f data/garmin-splits.json ]; then
            git add -f data/garmin-splits.json
            git diff --cached --quiet && echo "No changes to commit" || (
              git commit -m "Update garmin-splits [skip ci]" &&
              git pull --rebase origin main &&
              git push
            )
          else
            echo "garmin-splits.json no generado (error en proceso)"
          fi
