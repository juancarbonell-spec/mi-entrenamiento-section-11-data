name: Master Sync

on:
  workflow_dispatch:
    inputs:
      max_activities:
        description: 'Cuantas actividades procesar como maximo (ej: 30)'
        default: '30'
        type: string

jobs:
  intervals:
    uses: ./.github/workflows/sync.yml
    secrets: inherit

  dropbox-fit:
    needs: intervals
    uses: ./.github/workflows/sync_and_process.yml
    secrets: inherit

  splits-fit:
    needs: dropbox-fit
    uses: ./.github/workflows/sync_fit_splits.yml
    with:
      max_activities: ${{ inputs.max_activities || '30' }}
    secrets: inherit
